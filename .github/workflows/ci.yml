name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: node --run typecheck

      - name: ESLint
        run: node --run eslint

      - name: Oxfmt
        run: node --run format:check

      - name: Bundle
        run: node --run build

      - name: Build website
        run: node --run build:website

      - name: Check routeTree.gen.ts
        run: git diff --exit-code website/routeTree.gen.ts

      - name: Install Playwright Browsers
        run: npx playwright install chromium firefox
        timeout-minutes: 2

      - name: Test
        run: node --run test:ci
        timeout-minutes: 4

      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            test/**/__screenshots__/**
            test/**/__traces__/**
            .vitest-attachments/test/**
          if-no-files-found: ignore

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # push the release tag
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # only publish when package.json version changes - https://github.com/EndBug/version-check
      - name: Check version changes
        uses: EndBug/version-check@36ff30f37c7deabe56a30caa043d127be658c425 # 2.1.5
        id: version_check
        with:
          diff-search: true

      - name: Setup Node for npm registry
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        if: steps.version_check.outputs.changed == 'true'
        run: npm ci

      - name: Bundle
        if: steps.version_check.outputs.changed == 'true'
        run: node --run build

      - name: Publish to npm
        if: steps.version_check.outputs.changed == 'true'
        run: npm publish --tag latest

      - name: Push tag and create GitHub release
        if: steps.version_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.version_check.outputs.version }}
        run: |
          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"
          gh release create "v${NEW_VERSION}" --title "v${NEW_VERSION}" --generate-notes
